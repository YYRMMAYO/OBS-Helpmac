name: Build macOS

on:
  push:
    branches: [main]
    # 打 tag（如 1.5.0 / v1.5.0）时额外发布 GitHub Release 并上传 dmg
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon 原生构建机
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-13          # Intel 原生构建机
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # Blazor WASM 前端：dotnet publish 产出即 frontendDist 指向的 wwwroot
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor client
        run: dotnet publish OBS_Helper.Client/OBS_Helper.Client.csproj -c Release

      # Rust 工具链（含目标平台 triple）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri CLI 走 npm（比 cargo install 快得多）
      - name: Install Tauri CLI
        run: npm install --no-save --prefix . @tauri-apps/cli

      # icons/ 被 gitignore，需由源图现场生成（app-icon.png 已入库）
      - name: Generate icons
        run: npx tauri icon src-tauri/icons/app-icon.png --output src-tauri/icons
        working-directory: OBS_Helper.Mac

      # 构建 .app / .dmg（未签名；签名请配置 MAC_SIGN_IDENTITY 后另行处理）
      - name: Build app (dmg)
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: OBS_Helper.Mac/src-tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-helper-mac-${{ matrix.arch }}
          path: |
            OBS_Helper.Mac/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            OBS_Helper.Mac/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  # 打 tag 后把两个架构的 dmg 汇总发布到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OBS 排障助手 ${{ github.ref_name }}
          body: |
            ## OBS 排障助手（macOS 版）${{ github.ref_name }}

            - **aarch64**：Apple Silicon（M1 / M2 / M3 及更新）
            - **x86_64**：Intel Mac

            ### 安装
            下载对应架构的 .dmg，双击挂载后把「OBS 排障助手」拖入「应用程序」。
            首次打开如提示未受信任，请在「系统设置 → 隐私与安全性」中点击「仍要打开」。

            > 未签名构建，Gatekeeper 可能拦截；请按提示放行。
          files: |
            dist/*.dmg
          draft: true
